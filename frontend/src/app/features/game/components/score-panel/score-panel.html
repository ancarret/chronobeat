<div class="score-panel">
  <div class="stat identity">
    <span class="label">Round {{ roundNumber() }}</span>
    <span class="value name">{{ player().displayName }}</span>
  </div>
  <div class="stat">
    <span class="label">Score</span>
    <span class="value">{{ player().score }}</span>
  </div>
  <div class="stat" [class.hot]="isHot()">
    <span class="label">Streak</span>
    <span class="value">
      @if (isHot()) {
        <svg class="flame" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M12 2c.6 3.2-1.2 4.6-2.7 6.4C7.9 10 7 11.5 7 13.6 7 16.6 9.2 19 12 19s5-2.4 5-5.4c0-1.6-.6-2.9-1.6-4 .1 1.3-.4 2.2-1.2 2.6.5-3.9-.6-7.3-2.2-10.2z" />
          <path d="M12 22c-3.6 0-6.5-2.6-6.5-6.4 0-1.2.4-2.4 1-3.3.2 2.6 2.3 4.3 4.5 4.3 2.4 0 4-1.6 4.2-3.9.7.9 1.3 2.1 1.3 3.4 0 3.4-2.6 5.9-4.5 5.9z" opacity="0.55" />
        </svg>
      }
      {{ player().currentStreak }}
    </span>
  </div>
  <div class="stat lives">
    <span class="label">Lives</span>
    <span class="value hearts" [attr.aria-label]="player().livesRemaining + ' lives left'">
      @for (alive of hearts(); track $index) {
        <span class="heart" [class.lost]="!alive">♥</span>
      }
    </span>
  </div>
</div>
