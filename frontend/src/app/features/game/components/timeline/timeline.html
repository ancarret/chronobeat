<div class="timeline" [class.interactive]="interactive()">
  @if (entries().length === 0 && !interactive()) {
    <p class="empty">Your timeline is empty.</p>
  }

  @for (i of slotIndices(); track i) {
    @if (interactive()) {
      <button
        type="button"
        class="slot"
        [class.selected]="selectedPosition() === i"
        (click)="select(i)"
        [attr.aria-label]="selectedPosition() === i ? 'Placing here' : 'Place here'"
      >
        <span aria-hidden="true">{{ selectedPosition() === i ? '✓' : '+' }}</span>
      </button>
    }

    @if (entries()[i]; as entry) {
      <div class="entry">
        @if (entry.artworkUrl) {
          <img [src]="entry.artworkUrl" [alt]="entry.title" class="artwork" />
        } @else {
          <div class="artwork artwork-placeholder" aria-hidden="true">♪</div>
        }
        <div class="meta">
          <span class="year">{{ entry.year }}</span>
          <span class="title">{{ entry.title }}</span>
          <span class="artist">{{ entry.artist }}</span>
        </div>
      </div>
    }
  }
</div>
